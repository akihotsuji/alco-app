name: 実機QAの問題
description: Phase 5.5の実機操作で見つけた問題を、1問題ずつ再現可能な形で起票します
title: "[実機QA] "
body:
  - type: markdown
    attributes:
      value: |
        1件のIssueには1つの問題だけを書いてください。
        実利用データ、メールアドレス、Cookie、トークン、個人情報が写った画像は添付しないでください。

  - type: dropdown
    id: feature
    attributes:
      label: 対象機能
      options:
        - Phase 3 飲酒記録
        - Phase 4 セラー
        - Phase 5 テイスティングノート
        - 写真共通処理
        - 認証・設定・ナビゲーション
        - 機能間連携
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 影響度
      description: 原因ではなく、ユーザーとデータへの影響で選びます
      options:
        - Blocker（保存不能・データ損失・主要導線を完走できない）
        - High（回避困難な主要機能不良・頻発する失敗）
        - Medium（回避策がある不良・顕著な遅さ・限定端末）
        - Low（軽微な表示・文言・頻度の低い違和感）
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: 機種名は任意です。アプリ版にはコミットSHAを記載します
      placeholder: |
        OS:
        ブラウザと版:
        起動形態: ブラウザ / PWA
        接続: Wi-Fi / モバイル
        省電力: ON / OFF
        アプリ版:
    validations:
      required: true

  - type: textarea
    id: preconditions
    attributes:
      label: 前提条件
      description: 問題を再現するために必要な設定とテストデータだけを書きます
      placeholder: |
        例: 「切り抜く」ON、ラベル自動読み取りON、テスト用ボトル写真1枚
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 最小再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する結果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
      description: 推測した原因ではなく、画面・データ・時間として観測した事実を書きます
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: 再現率
      placeholder: 例: 5回中4回
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 証跡
      description: 個人情報を除いたスクリーンショット、動画、時刻、計測値、関連ログを記載します

  - type: textarea
    id: specification
    attributes:
      label: 関連仕様・既存Issue
      description: 該当するspec、画面設計、重複候補、回避策があれば記載します

  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 1件の問題だけを記載しました
          required: true
        - label: 実利用データ、シークレット、個人情報を含めていません
          required: true
