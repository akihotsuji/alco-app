name: Deploy prod

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  D1_BACKUP_TS: node --experimental-strip-types --disable-warning=ExperimentalWarning src/ci/d1-backup.ts

jobs:
  deploy:
    name: build / backup / migrate / deploy (env.production)
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require CI success on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=30" \
            | node --experimental-strip-types --disable-warning=ExperimentalWarning src/ci/require-ci-success.ts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          CLOUDFLARE_ENV: production
          VITE_APP_BUILD_ID: ${{ github.sha }}
        run: pnpm build

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Backup production D1 if migrations are pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backups
          list_log="$(mktemp)"
          pnpm exec wrangler d1 migrations list alco-app-prod --remote --env production 2>&1 \
            | $D1_BACKUP_TS sanitize-log | tee "${list_log}"
          status="$($D1_BACKUP_TS pending-migrations --file "${list_log}")"
          rm -f "${list_log}"
          if [ "${status}" = "none" ]; then
            echo "No pending production D1 migrations; skip pre-migrate backup"
            exit 0
          fi
          if [ "${status}" != "pending" ]; then
            echo "Could not determine pending production D1 migrations"
            exit 1
          fi
          echo "Pending production D1 migrations; taking pre-migrate backup"
          if ! pnpm exec wrangler r2 bucket info alco-app-d1-backups >/dev/null 2>&1; then
            pnpm exec wrangler r2 bucket create alco-app-d1-backups 2>&1 \
              | $D1_BACKUP_TS sanitize-log
          fi
          pnpm exec wrangler r2 bucket lifecycle set alco-app-d1-backups \
            --file src/ci/d1-backup-lifecycle.json -y 2>&1 \
            | $D1_BACKUP_TS sanitize-log
          raw="backups/alco-app-prod.sql"
          gz="${raw}.gz"
          key="$($D1_BACKUP_TS object-key --database alco-app-prod --kind pre-migrate)"
          pnpm exec wrangler d1 export alco-app-prod --remote --output="${raw}" \
            --env production --skip-confirmation 2>&1 \
            | $D1_BACKUP_TS sanitize-log
          gzip -n -9 "${raw}"
          $D1_BACKUP_TS summarize "${gz}"
          pnpm exec wrangler r2 object put "alco-app-d1-backups/${key}" \
            --file="${gz}" --remote --content-type application/gzip 2>&1 \
            | $D1_BACKUP_TS sanitize-log
          rm -f "${raw}" "${gz}"
          echo "Uploaded one pre-migrate D1 export to the private backup bucket"

      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler d1 migrations apply alco-app-prod --remote --env production 2>&1 \
            | node --experimental-strip-types --disable-warning=ExperimentalWarning src/ci/redact-wrangler-log.ts

      - name: Deploy Workers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --env production 2>&1 \
            | node --experimental-strip-types --disable-warning=ExperimentalWarning src/ci/redact-wrangler-log.ts
          echo "Deployed Worker alco-app-prod (env.production)"
